[GENERAL]
mode="hierarchical"     # Options include: "fixed", "random", "hierarchical". The default is "hierarchical".

[DATA_GENERATION]
generate_data=True      # Options: True, False
num_properties=1000
seed=42
flat_house_ratio=3      # Ratio of flats over houses in the total count.
room_exp_num=2.5        # Expected number of rooms per property. The code adds +1 to this to ensure no properties have 0 rooms.
distance_scale=5        # Scale in exponential function used to sample the distance (in km).
outdoor_space_weights=[0.3, 0.1, 0.2, 0.4]       # Relative probability weights for each outdoor space category (Garden, Balcony, Terrace, Nothing). MUST SUM TO 1.0.
underground_prob=0.3        # Probability of the property being close to an Underground station. MUST BE >= 0.0 and <= 1.0.

[PRICE_ARGUMENTS]
### The price is in GBP (£) and the arguments below determine its natural logarithm (ln).
noise_scale=0.05     # Determines the variance of the 0-mean noise added to ln(price). MUST BE POSITIVE.
## The following arguments are used as mean values in the price argument generation.
base=7.5       # The price if all property arguments are neglected. MUST BE POSITIVE.
room_coeff=0.15       # Multiplied by the number of rooms.
distance_coeff=-0.05       # Multiplied by the distance. MUST BE NEGATIVE.
underground_fee=0.1       # Only added if the property is near an Underground station.
house_fee=0.2      # Only added if the property is a house.
garden_fee=0.15     # Only added if the property has a garden.
terrace_fee=0.1     # Only added if the property has a terrace.
balcony_fee=0.05     # Only added if the property has a balcony.
agent_premium=0.15      # Only added if the property is leased by an agent. MUST BE POSITIVE.
## The following arguments determine the uncertainty in the price argument generation.
market_vol=0.03       # Market volatility determining deviation from mean argument values. MUST BE POSITIVE.
# Each of the following arguments is multiplied by the market volatility in order to determine the final volatility of the corresponding price argument. ALL MUST BE POSITIVE.
base_vol_scale=0.8
room_coeff_vol_scale=1.5
distance_coeff_vol_scale=1.0
underground_fee_vol_scale=0.5
house_fee_vol_scale=1.2
garden_fee_vol_scale=1.3
terrace_fee_vol_scale=1.1
balcony_fee_vol_scale=0.9
agent_premium_vol_scale=1.4
